<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or "Hotel Management System" }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container-fluid"><div class="row">
<div class="col-md-2 sidebar p-0">
<div class="brand"><img src="{{ url_for('static', filename='logo.svg') }}" alt="Royal Palace Hotel logo"><div class="hotel-name">Royal Palace Hotel</div><div class="tagline">Luxury &amp; Comfort · Lucknow</div></div>
<nav class="px-2">
<a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
<a href="{{ url_for('rooms') }}">🛏️ Rooms</a>
<a href="{{ url_for('customers') }}">👤 Customers</a>
<a href="{{ url_for('bookings') }}">📅 Bookings</a>
<a href="{{ url_for('logout') }}">🚪 Logout</a>
</nav>
</div>
<div class="col-md-10 content">
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div></div></div>
</body></html>
