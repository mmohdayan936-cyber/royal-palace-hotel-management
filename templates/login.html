<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Palace Hotel - Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{url_for('static',filename='style.css')}}" rel="stylesheet"></head><body class="login-page"><div class="container"><div class="login-box"><div class="login-card shadow-lg"><div class="card-body p-4 p-md-5 text-center"><img class="login-logo" src="{{url_for('static',filename='logo.svg')}}" alt="Royal Palace Hotel"><div class="login-title">Royal Palace Hotel</div><div class="gold mb-1">Luxury &amp; Comfort</div><div class="text-muted small mb-4">Lucknow</div><h5 class="mb-3">Admin Login</h5>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post" class="text-start"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-gold w-100 py-2">Login</button></form></div></div></div></div></body></html>
